--- begin ci.yml --- name: CI

on: push: branches: [''] pull_request: branches: ['']

jobs: build: name: Build on Ubuntu runs-on: ubuntu-latest
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Install build dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y build-essential cmake ninja-build pkg-config git python3 python3-pip

  - name: Create build dir
    run: mkdir -p build

  - name: Configure (CMake)
    run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

  - name: Build
    run: cmake --build build -- -j $(nproc)

  - name: Run tests
    run: |
      if [ -f build/CTestTestfile.cmake ]; then
        cd build
        ctest --output-on-failure --parallel $(nproc)
      else
        echo "No CTest tests found; skipping"
      fi
--- end ci.yml ---
